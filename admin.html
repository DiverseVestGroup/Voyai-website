<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TripMade — Admin</title>
<link rel="icon" href="https://tripmade.co/favicon.ico" sizes="48x48">
<!-- Private admin page (2026-09-26). Lists every itinerary request saved from
     the site form, flags the ones that never got an itinerary delivered, and
     lets Lachlan/Jai re-send any request through the Make.com pipeline with
     the customer's original answers. Data comes from the Supabase edge
     function rerun-itinerary-request; access needs the private ?key=… in the
     bookmarked link. -->
<style>
:root { --teal: #0D7377; --text: #1A1A1A; --muted: #6B6B6B; --bg: #F4F6F5; --red: #B3261E; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; padding: 24px 16px 60px; }
main { max-width: 920px; margin: 0 auto; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 4px 0 18px; }
h2 { font-size: 16px; margin: 26px 0 10px; }
.card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.meta { font-size: 13px; color: #555; line-height: 1.55; flex: 1; min-width: 240px; }
.meta b { color: var(--text); font-size: 15px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-left: 6px; vertical-align: 1px; }
.delivered { background: #E3F4EC; color: #0F7A4A; }
.submitted { background: #FDECEA; color: var(--red); }
.rerun { background: #FFF4D6; color: #8A5A00; }
.before_tracking { background: #EEE; color: #666; }
button { background: var(--teal); color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-weight: 700; cursor: pointer; font-size: 14px; white-space: nowrap; }
button.ghost { background: #fff; color: var(--teal); border: 1.5px solid var(--teal); }
button:disabled { opacity: .5; cursor: default; }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--teal); font-weight: 600; }
pre { white-space: pre-wrap; word-break: break-word; background: #F7F7F7; padding: 10px; border-radius: 6px; font-size: 12px; color: #333; }
.empty { background: #E3F4EC; color: #0F7A4A; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
.msg { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1A1A1A; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: 14px; display: none; max-width: 90vw; }
.err { color: var(--red); }
.tabs { display: flex; gap: 8px; margin: 6px 0 14px; flex-wrap: wrap; }
.tabs button { background: #fff; color: var(--teal); border: 1.5px solid var(--teal); padding: 7px 14px; }
.tabs button.on { background: var(--teal); color: #fff; }
.tip-card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.tip-card h3 { font-size: 15px; margin: 0 0 4px; }
.tip-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.tip-kind { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; margin-right: 6px; }
.tip-kind.upgrade { background: #FFF4D6; color: #8A5A00; }
.tip-kind.insider { background: #E3F4EC; color: #0F7A4A; }
.tip-card textarea, .tip-card input { width: 100%; font: inherit; font-size: 14px; border: 1.5px solid #DDD; border-radius: 8px; padding: 8px 10px; margin: 4px 0; }
.tip-card textarea { min-height: 80px; resize: vertical; }
.tip-note { font-size: 12.5px; background: #FFF8E6; color: #7A5B00; border-radius: 8px; padding: 7px 10px; margin: 6px 0; }
.tip-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.tip-acts .reject { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
.tip-bulk { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; }
.tip-bulk span { font-size: 12.5px; color: var(--muted); }
.tip-card a { color: var(--teal); font-size: 12.5px; word-break: break-all; }
.ven-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; }
.ven-tools input { flex: 1; min-width: 200px; font: inherit; font-size: 14px; border: 1.5px solid #DDD; border-radius: 8px; padding: 8px 10px; }
.ven-tbl { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); font-size: 13.5px; }
.ven-tbl th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #FAFAFA; padding: 9px 12px; border-bottom: 1px solid #EEE; }
.ven-tbl td { padding: 9px 12px; border-bottom: 1px solid #F1F1F1; vertical-align: middle; }
.ven-tbl tr:last-child td { border-bottom: none; }
.ven-tbl a { color: var(--teal); font-weight: 600; text-decoration: none; white-space: nowrap; }
.ven-bd { font-size: 11.5px; color: #667; margin-top: 3px; }
.ven-type { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 10px; background: #EEF6F5; color: var(--teal); }
.ven-more { margin-top: 10px; }
/* 2026-11-23: Deals to approve */
.deal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.deal-grid label { font-size: 11.5px; color: var(--muted); display: block; margin-top: 4px; }
.deal-grid .wide { grid-column: 1 / -1; }
.link-ok { background: #E3F4EC; color: #0F7A4A; }
.link-bad { background: #FDECEA; color: var(--red); }
.link-wait { background: #EEE; color: #666; }
.deal-price { font-size: 13px; margin: 4px 0; }
.deal-price s { color: var(--muted); }
.auto-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 12px; }
@media (max-width: 640px) {
  .ven-tbl .hide-sm { display: none; }
  .deal-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>✈ Itinerary requests</h1>
    <button class="ghost" onclick="load(); loadVenues(); loadTips(); loadDeals();">Refresh</button>
  </header>
  <p class="sub" id="sub"></p>
  <!-- 2026-11-23: Deals for tripmade.co/deals. The Deals Scout adds them as
       pending; only approved ones show on the site (deals edge function,
       ?admin=1, same access key). -->
  <h2>🏷 Deals to approve</h2>
  <p class="sub" id="deals-sub"></p>
  <div class="auto-row" id="deals-auto"></div>
  <div class="tabs" id="deal-tabs"></div>
  <div id="deals"></div>
  <!-- 2026-10-14: TripMade local knowledge. Tips only reach customers once
       approved here (local-tips-admin edge function, same access key). -->
  <h2>💡 Local tips &amp; upgrades</h2>
  <p class="sub" id="tips-sub"></p>
  <div class="tabs" id="tip-tabs"></div>
  <div id="tips"></div>
  <!-- 2026-10-26: every venue TripMade has recommended (own itinerary data).
       "Google Maps" opens the listing so you can check their website, menu
       and contact details by hand. -->
  <h2>🍽 Venues we recommend</h2>
  <p class="sub" id="ven-sub"></p>
  <div class="ven-tools">
    <input type="search" id="ven-q" placeholder="Search venue or city…" oninput="renderVenues()">
    <div class="tabs" id="ven-tabs" style="margin:0;"></div>
  </div>
  <div id="venues"></div>
  <h2>⚠️ Not delivered (older than 15 minutes)</h2>
  <div id="stuck"></div>
  <h2>Latest requests</h2>
  <div id="recent"></div>
</main>
<div class="msg" id="msg"></div>
<script>
const API = 'https://ccdbpyqjlvzusjgedhck.supabase.co/functions/v1/rerun-itinerary-request';
const KEY = new URLSearchParams(location.search).get('key') || '';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(t) { const m = document.getElementById('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => m.style.display = 'none', 6000); }
function card(r) {
  const st = r.status || 'submitted';
  const label = st === 'delivered' ? 'Delivered' : st === 'rerun' ? 'Re-run sent (' + r.rerun_count + 'x)' : st === 'before_tracking' ? 'Before tracking' : 'Not delivered';
  const when = new Date(r.created_at).toLocaleString('en-AU', { timeZone: 'Australia/Sydney', dateStyle: 'medium', timeStyle: 'short' });
  const btn = (st === 'delivered' || st === 'before_tracking')
    ? '<button class="ghost" onclick="rerun(\'' + r.id + '\', true, this)">Re-run anyway</button>'
    : '<button onclick="rerun(\'' + r.id + '\', false, this)">Re-run</button>';
  return '<div class="card"><div class="meta"><b>' + esc(r.destination || '(no destination)') + '</b><span class="pill ' + esc(st) + '">' + esc(label) + '</span><br>' +
    esc(r.name) + ' · ' + esc(r.email) + (r.phone ? ' · ' + esc(r.phone) : '') + '<br>' +
    esc(r.depart_date) + ' → ' + esc(r.return_date) + ' · ' + esc(r.travellers) + ' travellers · submitted ' + esc(when) +
    '<details><summary>Everything they entered</summary><pre>' + esc(JSON.stringify(r.answers, null, 2)) + '</pre></details></div>' + btn + '</div>';
}
async function load() {
  const sub = document.getElementById('sub');
  if (!KEY) { sub.innerHTML = '<span class="err">Missing access key — open this page from the bookmarked link.</span>'; return; }
  sub.textContent = 'Loading…';
  try {
    const res = await fetch(API + '?key=' + encodeURIComponent(KEY));
    if (res.status === 401) { sub.innerHTML = '<span class="err">Wrong access key.</span>'; return; }
    const d = await res.json();
    sub.textContent = d.total + ' requests saved in total. Private page — don\'t share this link.';
    document.getElementById('stuck').innerHTML = d.stuck.length ? d.stuck.map(card).join('') : '<div class="empty">Nothing stuck — every request has been delivered. 🎉</div>';
    document.getElementById('recent').innerHTML = d.recent.map(card).join('');
  } catch (e) { sub.innerHTML = '<span class="err">Couldn\'t load requests — check your connection and hit Refresh.</span>'; }
}
async function rerun(id, alreadyDelivered, btn) {
  const warn = alreadyDelivered
    ? 'This one was already delivered. Send it through again? The customer will get a second itinerary and email.'
    : 'Re-send this request through the itinerary pipeline? The customer will get their itinerary and the "ready" email in 1–2 minutes.';
  if (!confirm(warn)) return;
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const res = await fetch(API + '?key=' + encodeURIComponent(KEY) + '&id=' + encodeURIComponent(id), { method: 'POST' });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'failed');
    toast('Re-run sent for ' + d.name + ' (' + d.destination + '). It should land in their Inbox in 1–2 minutes.');
    setTimeout(load, 1500);
  } catch (e) { btn.disabled = false; btn.textContent = 'Re-run'; toast('Couldn\'t send — nothing went out. Try again in a minute.'); }
}
load();
// ── Deals to approve (2026-11-23) ────────────────────────────────────
const DEALS_API = 'https://ccdbpyqjlvzusjgedhck.supabase.co/functions/v1/deals';
let _deals = [], _dealTab = 'pending', _dealSettings = {};
function dealUrl() { return DEALS_API + '?admin=1&key=' + encodeURIComponent(KEY); }
async function loadDeals() {
  const sub = document.getElementById('deals-sub');
  if (!KEY) { sub.textContent = ''; return; }
  sub.textContent = 'Loading…';
  try {
    const res = await fetch(dealUrl());
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'failed');
    _deals = d.deals || []; _dealSettings = d.settings || {};
    sub.textContent = 'Deals found by the Deals Scout. Only approved ones show on tripmade.co/deals. Edit the wording first if you like, then Approve.';
    renderDeals();
  } catch (e) { sub.innerHTML = '<span class="err">Couldn\'t load deals. Hit Refresh.</span>'; }
}
function dealTab(s) { _dealTab = s; renderDeals(); }
function linkPill(d) {
  if (d.affiliate_url && d.link_status !== 'failed') return '<span class="pill link-ok">Partner link ready</span>';
  if (d.link_status === 'failed') return '<span class="pill link-bad">No partner link</span>';
  return '<span class="pill link-wait">Link check due on the hour</span>';
}
function renderDeals() {
  const n = s => _deals.filter(d => d.status === s).length;
  document.getElementById('deal-tabs').innerHTML = [['pending','To approve'],['live','Live'],['rejected','Rejected']]
    .map(([s,l]) => '<button class="' + (_dealTab === s ? 'on' : '') + '" onclick="dealTab(\'' + s + '\')">' + l + ' (' + n(s) + ')</button>').join('');
  const on = _dealSettings.auto_publish === true;
  document.getElementById('deals-auto').innerHTML = '<span>Auto-publish is <b>' + (on ? 'on' : 'off') + '</b>. ' +
    (on ? 'Pending deals with a working partner link go live within the hour.' : 'Every deal waits for you to approve it.') +
    '</span><button class="ghost" onclick="dealAuto(' + (!on) + ', this)">' + (on ? 'Turn off auto-publish' : 'Turn on auto-publish') + '</button>';
  const list = _deals.filter(d => d.status === _dealTab);
  const ready = list.filter(d => d.affiliate_url && d.link_status !== 'failed');
  const bulk = _dealTab === 'pending' && ready.length > 1
    ? '<div class="tip-bulk"><button onclick="dealApproveReady(this)">Approve all ' + ready.length + ' with partner links</button><span>Includes any edits you\'ve typed. Deals without a partner link are left for you to check one by one.</span></div>' : '';
  document.getElementById('deals').innerHTML = bulk + (list.length ? list.map(d => {
    const where = [d.city, d.country].filter(Boolean).join(', ');
    const price = (d.was || d.now) ? '<div class="deal-price">' + (d.was ? '<s>' + esc(d.currency || '') + ' ' + esc(d.was) + '</s> ' : '') + (d.now ? '<b>' + esc(d.currency || '') + ' ' + esc(d.now) + '</b>' : '') + (d.per ? ' ' + esc(d.per) : '') + '</div>' : '';
    const added = new Date(d.created_at).toLocaleDateString('en-AU', { timeZone: 'Australia/Sydney', day: 'numeric', month: 'short' });
    return '<div class="tip-card" id="deal-' + d.id + '">' +
      '<div class="tip-meta"><span class="tip-kind insider">' + esc(d.brand) + '</span>' + esc(d.type || '') + (where ? ' · ' + esc(where) : '') + ' · added ' + esc(added) + ' by ' + esc(d.found_by || '?') + linkPill(d) + '</div>' +
      price +
      '<div class="deal-grid">' +
        '<div class="wide"><label>Title</label><input data-f="title" value="' + esc(d.title) + '"></div>' +
        '<div class="wide"><label>Detail</label><textarea data-f="detail">' + esc(d.detail) + '</textarea></div>' +
        '<div><label>Discount</label><input data-f="discount" value="' + esc(d.discount) + '"></div>' +
        '<div><label>Promo code</label><input data-f="code" value="' + esc(d.code) + '"></div>' +
        '<div><label>Ends (YYYY-MM-DD, blank if none)</label><input data-f="expires" value="' + esc(d.expires) + '"></div>' +
        '<div><label>Type</label><input data-f="type" value="' + esc(d.type) + '"></div>' +
        '<div><label>Country</label><input data-f="country" value="' + esc(d.country) + '"></div>' +
        '<div><label>City</label><input data-f="city" value="' + esc(d.city) + '"></div>' +
      '</div>' +
      (d.link_note ? '<div class="tip-note">Link: ' + esc(d.link_note) + '</div>' : '') +
      '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">Deal page: ' + esc(d.url) + '</a>' +
      (d.source_url && d.source_url !== d.url ? '<br><a href="' + esc(d.source_url) + '" target="_blank" rel="noopener">Where it was found: ' + esc(d.source_url) + '</a>' : '') +
      (d.approved_by ? '<div class="tip-meta" style="margin-top:6px;">' + esc(d.approved_by) + '</div>' : '') +
      '<div class="tip-acts">' +
        (d.status !== 'live' ? '<button onclick="dealApprove(\'' + d.id + '\',this)">Approve</button>' : '<button class="ghost" onclick="dealAct(\'' + d.id + '\',\'offline\',this)">Take offline</button>') +
        '<button class="ghost" onclick="dealSave(\'' + d.id + '\',this)">Save edits</button>' +
        (d.status !== 'rejected' ? '<button class="reject" onclick="dealAct(\'' + d.id + '\',\'reject\',this)">Reject</button>' : '') +
      '</div></div>';
  }).join('') : '<div class="empty">Nothing here.</div>');
}
async function dealPost(body) {
  const res = await fetch(dealUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, d };
}
function dealFields(id) {
  const c = document.getElementById('deal-' + id); const o = {};
  if (!c) return o;
  c.querySelectorAll('[data-f]').forEach(el => { o[el.dataset.f] = el.value.trim(); });
  return o;
}
function dealReplace(deal) { _deals = _deals.map(x => x.id === deal.id ? deal : x); renderDeals(); }
async function dealSaveFields(id) {
  const r = await dealPost(Object.assign({ id, action: 'update' }, dealFields(id)));
  if (!r.ok) throw new Error(r.d.error || 'failed');
  return r.d.deal;
}
async function dealSave(id, btn) {
  btn.disabled = true;
  try { dealReplace(await dealSaveFields(id)); toast('Saved.'); }
  catch (e) { btn.disabled = false; toast('Couldn\'t save. Try again.'); }
}
async function dealApprove(id, btn) {
  btn.disabled = true;
  try {
    await dealSaveFields(id);
    let r = await dealPost({ id, action: 'approve' });
    if (r.status === 409 && r.d.error === 'no_partner_link') {
      const go = confirm('This deal has no partner link, so TripMade earns nothing if people book through it.\n\n' + (r.d.link_note || '') + '\n\nPublish it with the plain link anyway?');
      if (!go) { await loadDeals(); toast('Not published.'); return; }
      r = await dealPost({ id, action: 'approve', allow_plain_link: true });
    }
    if (!r.ok) throw new Error(r.d.error || 'failed');
    dealReplace(r.d.deal);
    toast('Approved. It now shows on tripmade.co/deals.');
  } catch (e) { btn.disabled = false; toast('Couldn\'t approve. Try again.'); }
}
async function dealAct(id, action, btn) {
  btn.disabled = true;
  try {
    if (action === 'reject') await dealSaveFields(id);
    const r = await dealPost({ id, action });
    if (!r.ok) throw new Error(r.d.error || 'failed');
    dealReplace(r.d.deal);
    toast(action === 'reject' ? 'Rejected.' : 'Taken offline. It\'s back in To approve.');
  } catch (e) { btn.disabled = false; toast('Couldn\'t update. Try again.'); }
}
async function dealApproveReady(btn) {
  const ids = _deals.filter(d => d.status === 'pending' && d.affiliate_url && d.link_status !== 'failed').map(d => d.id);
  if (!ids.length) return;
  if (!confirm('Approve all ' + ids.length + ' deals with partner links? They\'ll show on tripmade.co/deals straight away.')) return;
  const fields = {}; ids.forEach(id => { fields[id] = dealFields(id); });
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const id of ids) {
    btn.textContent = 'Approving ' + (done + failed + 1) + ' of ' + ids.length + '…';
    try {
      const u = await dealPost(Object.assign({ id, action: 'update' }, fields[id]));
      if (!u.ok) throw new Error('update');
      const r = await dealPost({ id, action: 'approve' });
      if (!r.ok) throw new Error('approve');
      _deals = _deals.map(x => x.id === r.d.deal.id ? r.d.deal : x);
      done++;
    } catch (e) { failed++; }
  }
  renderDeals();
  toast(failed ? 'Approved ' + done + ', ' + failed + ' failed. Try those again.' : 'Approved all ' + done + '. They now show on tripmade.co/deals.');
}
async function dealAuto(on, btn) {
  if (!confirm(on ? 'Turn on auto-publish? From the next hourly check, pending deals with a working partner link go live without you approving them.' : 'Turn off auto-publish? New deals will wait for you to approve them.')) return;
  btn.disabled = true;
  try {
    const r = await dealPost({ action: 'auto_publish', on });
    if (!r.ok) throw new Error(r.d.error || 'failed');
    _dealSettings = r.d.settings || {}; renderDeals();
    toast(on ? 'Auto-publish is on.' : 'Auto-publish is off.');
  } catch (e) { btn.disabled = false; toast('Couldn\'t change it. Try again.'); }
}
loadDeals();
// ── Venues we recommend (2026-10-26) ─────────────────────────────────
let _venues = [], _venTab = 'all', _venShow = 50;
const VEN_TABS = { all: 'All', food: 'Restaurants & bars', activity: 'Experiences', hotel: 'Hotels' };
async function loadVenues() {
  const sub = document.getElementById('ven-sub');
  if (!KEY) { sub.textContent = ''; return; }
  sub.textContent = 'Loading…';
  try {
    const res = await fetch(API + '?key=' + encodeURIComponent(KEY) + '&venues=1');
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || 'failed');
    _venues = d.venues || [];
    renderVenues();
  } catch (e) { sub.innerHTML = '<span class="err">Couldn\'t load venues. Hit Refresh to try again.</span>'; }
}
function venTab(t) { _venTab = t; _venShow = 50; renderVenues(); }
function renderVenues() {
  const q = (document.getElementById('ven-q').value || '').trim().toLowerCase();
  document.getElementById('ven-tabs').innerHTML = Object.keys(VEN_TABS).map(t => {
    const n = t === 'all' ? _venues.length : _venues.filter(v => v.type === t).length;
    return '<button class="' + (t === _venTab ? 'on' : '') + '" onclick="venTab(\'' + t + '\')">' + VEN_TABS[t] + ' (' + n + ')</button>';
  }).join('');
  const list = _venues.filter(v => (_venTab === 'all' || v.type === _venTab) && (!q || (v.name + ' ' + v.city).toLowerCase().includes(q)));
  const multi = _venues.filter(v => v.trips >= 2).length;
  const views = _venues.reduce((a, v) => a + (v.shown || 0), 0), taps = _venues.reduce((a, v) => a + (v.clicks || 0), 0);
  document.getElementById('ven-sub').textContent = _venues.length + ' venues recommended in the last 12 months · ' + multi + ' in 2+ trips. ' +
    (views ? views.toLocaleString('en-AU') + ' views and ' + taps.toLocaleString('en-AU') + ' taps in the last 90 days (trip pages + Ask TripMade). ' : 'Views and taps start counting once the latest site is live. ') +
    'Most-recommended first. Tap a venue\'s numbers for the breakdown.';
  if (!list.length) { document.getElementById('venues').innerHTML = '<div class="empty">No venues match.</div>'; return; }
  const type = { food: 'Food', activity: 'Experience', hotel: 'Hotel' };
  const rows = list.slice(0, _venShow).map(v => {
    const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v.name + (v.city ? ', ' + v.city : '')) + (v.place_id ? '&query_place_id=' + encodeURIComponent(v.place_id) : '');
    const last = v.last ? new Date(v.last).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
    return '<tr><td><b>' + esc(v.name) + '</b></td><td>' + esc(v.city) + '</td><td class="hide-sm"><span class="ven-type">' + (type[v.type] || esc(v.type)) + '</span></td>' +
      '<td>' + (v.ask_only ? '<span class="ven-type">Ask only</span>' : v.trips + ' trip' + (v.trips === 1 ? '' : 's')) + '</td>' +
      '<td title="' + esc('Map ' + (v.map || 0) + ' · Menu ' + (v.menu || 0) + ' · Website ' + (v.website || 0) + ' · Book ' + (v.book || 0) + ' · Rating ' + (v.rating || 0)) + '" onclick="this.querySelector(\'.ven-bd\').hidden = !this.querySelector(\'.ven-bd\').hidden" style="cursor:pointer;">' +
        '<b>' + (v.shown || 0) + '</b> views · <b>' + (v.clicks || 0) + '</b> taps' +
        '<div class="ven-bd" hidden>Map ' + (v.map || 0) + ' · Menu ' + (v.menu || 0) + ' · Website ' + (v.website || 0) + ' · Book ' + (v.book || 0) + ' · Rating ' + (v.rating || 0) + '</div></td>' +
      '<td class="hide-sm">' + esc(last) + '</td><td><a href="' + esc(maps) + '" target="_blank" rel="noopener">Google Maps ↗</a></td></tr>';
  }).join('');
  document.getElementById('venues').innerHTML = '<table class="ven-tbl"><thead><tr><th>Venue</th><th>City</th><th class="hide-sm">Type</th><th>Recommended</th><th>Seen (90 days)</th><th class="hide-sm">Last</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    (list.length > _venShow ? '<div class="ven-more"><button class="ghost" onclick="_venShow += 100; renderVenues();">Show more (' + (list.length - _venShow) + ' left)</button></div>' : '');
}
loadVenues();
// ── Local tips review (2026-10-14) ───────────────────────────────────
const TIPS_API = 'https://ccdbpyqjlvzusjgedhck.supabase.co/functions/v1/local-tips-admin';
let _tips = [], _tipTab = 'draft';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function tipTab(s) { _tipTab = s; renderTips(); }
function renderTips() {
  const n = s => _tips.filter(t => t.status === s).length;
  document.getElementById('tip-tabs').innerHTML = [['draft','To review'],['approved','Live'],['rejected','Rejected']]
    .map(([s,l]) => '<button class="' + (_tipTab === s ? 'on' : '') + '" onclick="tipTab(\'' + s + '\')">' + l + ' (' + n(s) + ')</button>').join('');
  const list = _tips.filter(t => t.status === _tipTab);
  // 2026-10-17: "Approve all" on the To review tab (keeps any wording edits typed into the cards).
  const bulk = _tipTab === 'draft' && list.length > 1
    ? '<div class="tip-bulk"><button id="tip-approve-all" onclick="tipApproveAll(this)">Approve all ' + list.length + '</button><span>Approves every tip in this list, including any edits you\'ve typed.</span></div>' : '';
  document.getElementById('tips').innerHTML = bulk + (list.length ? list.map(t => {
    const months = (t.months || []).length ? ' · ' + t.months.map(m => MONTHS[m - 1]).join(', ') + ' only' : '';
    return '<div class="tip-card" id="tip-' + t.id + '">' +
      '<div class="tip-meta"><span class="tip-kind ' + esc(t.kind) + '">' + (t.kind === 'upgrade' ? 'Upgrade idea' : 'Local tip') + '</span>' + esc(t.destination || '') + esc(months) + ' · added by ' + esc(t.added_by || '?') + '</div>' +
      '<input data-f="title" value="' + esc(t.title) + '">' +
      '<textarea data-f="tip">' + esc(t.tip) + '</textarea>' +
      '<div class="tip-meta">Shows on any day mentioning: <input data-f="keywords" value="' + esc((t.keywords || []).join(', ')) + '"></div>' +
      (t.notes ? '<div class="tip-note">Check: ' + esc(t.notes) + '</div>' : '') +
      (t.source_url ? '<a href="' + esc(t.source_url) + '" target="_blank" rel="noopener">Source: ' + esc(t.source_url) + '</a>' : '<div class="tip-meta">No source, general knowledge</div>') +
      '<div class="tip-acts">' +
        (t.status !== 'approved' ? '<button onclick="tipAct(\'' + t.id + '\',\'approve\',this)">Approve</button>' : '<button class="ghost" onclick="tipAct(\'' + t.id + '\',\'draft\',this)">Take offline</button>') +
        '<button class="ghost" onclick="tipSave(\'' + t.id + '\',this)">Save edits</button>' +
        (t.status !== 'rejected' ? '<button class="reject" onclick="tipAct(\'' + t.id + '\',\'reject\',this)">Reject</button>' : '') +
      '</div></div>';
  }).join('') : '<div class="empty">Nothing here.</div>');
}
async function tipApproveAll(btn) {
  const ids = _tips.filter(t => t.status === 'draft').map(t => t.id);
  if (!ids.length) return;
  if (!confirm('Approve all ' + ids.length + ' tips? They\'ll start showing on matching trips straight away.')) return;
  const fields = {};
  ids.forEach(id => { if (document.getElementById('tip-' + id)) fields[id] = tipFields(id); });
  btn.disabled = true;
  let done = 0, failed = 0;
  for (const id of ids) {
    btn.textContent = 'Approving ' + (done + failed + 1) + ' of ' + ids.length + '…';
    try {
      if (fields[id]) await tipPost(Object.assign({ id, action: 'update' }, fields[id]));
      const tip = await tipPost({ id, action: 'approve' });
      _tips = _tips.map(t => t.id === tip.id ? tip : t);
      done++;
    } catch (e) { failed++; }
  }
  renderTips();
  toast(failed ? 'Approved ' + done + ', ' + failed + ' failed. Try those again.' : 'Approved all ' + done + '. They now show on matching trips.');
}
async function loadTips() {
  const sub = document.getElementById('tips-sub');
  if (!KEY) { sub.textContent = ''; return; }
  try {
    const res = await fetch(TIPS_API + '?key=' + encodeURIComponent(KEY));
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    _tips = d.tips || [];
    sub.textContent = 'Tips and upgrade ideas shown on matching itinerary days. Only approved ones reach customers. Edit the wording first if you like, then Approve.';
    renderTips();
  } catch (e) { sub.innerHTML = '<span class="err">Couldn\'t load tips. Hit Refresh.</span>'; }
}
async function tipPost(body) {
  const res = await fetch(TIPS_API + '?key=' + encodeURIComponent(KEY), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await res.json(); if (!res.ok) throw new Error(d.error || 'failed'); return d.tip;
}
function tipFields(id) {
  const c = document.getElementById('tip-' + id);
  return { title: c.querySelector('[data-f=title]').value, tip: c.querySelector('[data-f=tip]').value,
    keywords: c.querySelector('[data-f=keywords]').value.split(',').map(s => s.trim()).filter(Boolean) };
}
function tipReplace(tip) { _tips = _tips.map(t => t.id === tip.id ? tip : t); renderTips(); }
async function tipSave(id, btn) {
  btn.disabled = true;
  try { tipReplace(await tipPost(Object.assign({ id, action: 'update' }, tipFields(id)))); toast('Saved.'); }
  catch (e) { btn.disabled = false; toast('Couldn\'t save. Try again.'); }
}
async function tipAct(id, action, btn) {
  btn.disabled = true;
  try {
    await tipPost(Object.assign({ id, action: 'update' }, tipFields(id)));
    tipReplace(await tipPost({ id, action }));
    toast(action === 'approve' ? 'Approved. It now shows on matching trips.' : action === 'reject' ? 'Rejected.' : 'Taken offline.');
  } catch (e) { btn.disabled = false; toast('Couldn\'t update. Try again.'); }
}
loadTips();
</script>
