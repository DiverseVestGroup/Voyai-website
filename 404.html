<title>TripMade</title>
<script>
(function () {
  var map = { '/inbox': 'inbox', '/saved': 'saved', '/ask': 'ask', '/book': 'tours', '/inspiration': 'inspo' };
  var path = (location.pathname || '/').toLowerCase().replace(/\/+$/, '');
  location.replace(map[path] ? '/?page=' + map[path] : '/');
})();
</script>
